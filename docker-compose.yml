version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: barbertop_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-barbertop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: barbertop_redis
    restart: always
    ports:
      - "6379:6379"

  bot:
    build: .
    container_name: barbertop_bot
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  postgres_data:
